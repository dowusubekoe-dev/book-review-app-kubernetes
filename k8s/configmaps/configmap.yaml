apiVersion: v1
kind: ConfigMap
metadata:
  name: book-review-config
  namespace: book-review
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "example_database"
  DB_USER: "example_user"
  DB_DIALECT: "mysql"
  ALLOWED_ORIGINS: "http://frontend-service,http://localhost:3000"
  NEXT_PUBLIC_API_URL: "http://backend-service:5000"
